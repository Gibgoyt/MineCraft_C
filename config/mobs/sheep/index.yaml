# A sheep (plan 005 phase 4): ewe and ram alike give 1 to 3 white wool to shears, which grows back in 5 minutes.
# The wool box is drawn only while it can be shorn (fleece: true). The ram is a fifth bigger, with big curled horns.
name: sheep
texture: mobs/sheep
texture_width: 128
texture_height: 64
mind: passive
health: 8
speed: 0.1
half_width: 0.45
height: 1.3
drops:
  - { item: mutton, count: 1, max: 2 }
  - { item: white_wool, count: 1 }
spawn:
  weight: 12
  pack_min: 2
  pack_max: 4
  max_light: 15
  max_block_light: 15
  # The published game's animals come where the light is above 8.
  min_light: 9
  min_distance: 24
  on: [grass_block]
  biomes: [plains, sunflower_plains, meadow, forest, flower_forest, birch_forest, savanna]
parts:
  - { size: [3, 3, 10], pivot: [5, 2.5, 10], offset: [0, 0, -5], uv: [96, 0], walk_swing: 1 }
  - { size: [3, 3, 10], pivot: [5, -2.5, 10], offset: [0, 0, -5], uv: [96, 0], walk_swing: -1 }
  - { size: [3, 3, 10], pivot: [-5, 2.5, 10], offset: [0, 0, -5], uv: [96, 0], walk_swing: -1 }
  - { size: [3, 3, 10], pivot: [-5, -2.5, 10], offset: [0, 0, -5], uv: [96, 0], walk_swing: 1 }
  - { size: [14, 8, 10], pivot: [0, 0, 15], offset: [0, 0, 0], uv: [52, 0] }
  - { size: [16, 10, 12], pivot: [0, 0, 15], offset: [0, 0, 0], uv: [0, 0], fleece: true }
  - { size: [6, 6, 6], pivot: [7, 0, 17], offset: [3, 0, 1], uv: [0, 28], moves: head }
male:
  name: ram
  scale: 1.2
  # Big curled horns: over the back of the head, down its sides, and forward under the eyes.
  parts:
    - { size: [3, 2, 3], pivot: [7, 0, 17], offset: [1.5, 4, 3.5], uv: [36, 28], moves: head }
    - { size: [3, 2, 3], pivot: [7, 0, 17], offset: [1.5, -4, 3.5], uv: [36, 28], moves: head }
    - { size: [4, 2, 3], pivot: [7, 0, 17], offset: [1, 4.5, 0.5], uv: [24, 28], moves: head }
    - { size: [4, 2, 3], pivot: [7, 0, 17], offset: [1, -4.5, 0.5], uv: [24, 28], moves: head }
    - { size: [2, 2, 3], pivot: [7, 0, 17], offset: [3.5, 4, -2], uv: [46, 28], moves: head }
    - { size: [2, 2, 3], pivot: [7, 0, 17], offset: [3.5, -4, -2], uv: [46, 28], moves: head }
  yields:
    - { item: white_wool, count: 1, max: 3, using: shears, every: 6000 }
female:
  name: ewe
  scale: 1
  yields:
    - { item: white_wool, count: 1, max: 3, using: shears, every: 6000 }
