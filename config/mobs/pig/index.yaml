# A pig (plan 005 phase 4): a pink sow, and a boar a quarter bigger, dark brown and bristly, with tusks and a ridge.
# The body is in each sex's parts, so the two can have different skins. Neither gives anything alive.
name: pig
texture: mobs/pig
texture_width: 128
texture_height: 64
mind: passive
health: 10
speed: 0.1
half_width: 0.45
height: 0.9
drops:
  - { item: pork, count: 1, max: 3 }
  - { item: pig_hide, count: 0, max: 2 }
spawn:
  weight: 10
  pack_min: 2
  pack_max: 4
  max_light: 15
  max_block_light: 15
  # The published game's animals come where the light is above 8.
  min_light: 9
  min_distance: 24
  on: [grass_block]
  biomes: [plains, sunflower_plains, meadow, forest, flower_forest, birch_forest, savanna]
parts:
  - { size: [2, 1, 2], pivot: [-8, 0, 12], offset: [-1, 0, 0], uv: [120, 24] }
male:
  name: boar
  scale: 1.25
  # Dark and bristly, a ridge down the back, and tusks beside the snout.
  parts:
    - { size: [4, 4, 6], pivot: [5, 3, 6], offset: [0, 0, -3], uv: [88, 24], walk_swing: 1 }
    - { size: [4, 4, 6], pivot: [5, -3, 6], offset: [0, 0, -3], uv: [88, 24], walk_swing: -1 }
    - { size: [4, 4, 6], pivot: [-5, 3, 6], offset: [0, 0, -3], uv: [88, 24], walk_swing: -1 }
    - { size: [4, 4, 6], pivot: [-5, -3, 6], offset: [0, 0, -3], uv: [88, 24], walk_swing: 1 }
    - { size: [16, 10, 8], pivot: [0, 0, 10], offset: [0, 0, 0], uv: [0, 0] }
    - { size: [8, 8, 8], pivot: [8, 0, 11], offset: [4, 0, 0], uv: [0, 24], moves: head }
    - { size: [1, 4, 3], pivot: [8, 0, 11], offset: [8.5, 0, -1], uv: [0, 40], moves: head }
    - { size: [1, 1, 3], pivot: [8, 0, 11], offset: [8.5, 2.5, 0.5], uv: [10, 40], moves: head }
    - { size: [1, 1, 3], pivot: [8, 0, 11], offset: [8.5, -2.5, 0.5], uv: [10, 40], moves: head }
    - { size: [10, 2, 2], pivot: [0, 0, 10], offset: [1, 0, 4.5], uv: [64, 24] }
  drops:
    - { item: pork, count: 1 }
female:
  name: sow
  scale: 1
  # Pink all over.
  parts:
    - { size: [4, 4, 6], pivot: [5, 3, 6], offset: [0, 0, -3], uv: [104, 24], walk_swing: 1 }
    - { size: [4, 4, 6], pivot: [5, -3, 6], offset: [0, 0, -3], uv: [104, 24], walk_swing: -1 }
    - { size: [4, 4, 6], pivot: [-5, 3, 6], offset: [0, 0, -3], uv: [104, 24], walk_swing: -1 }
    - { size: [4, 4, 6], pivot: [-5, -3, 6], offset: [0, 0, -3], uv: [104, 24], walk_swing: 1 }
    - { size: [16, 10, 8], pivot: [0, 0, 10], offset: [0, 0, 0], uv: [52, 0] }
    - { size: [8, 8, 8], pivot: [8, 0, 11], offset: [4, 0, 0], uv: [32, 24], moves: head }
    - { size: [1, 4, 3], pivot: [8, 0, 11], offset: [8.5, 0, -1], uv: [14, 40], moves: head }
