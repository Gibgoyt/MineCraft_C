# A stand-in, from plan 005 phase 4 stage 1: the smallest animal that works the systems an animal needs (male and female,
# the passive mind, its own cap, daylight on grass). It borrows the creeper's skin and drops leather, and its weight is 0,
# so it never comes by itself and is not kept from a save. Stage 3 gives the pig its own model, skin, meat and weight.
name: pig
texture: mobs/creeper
texture_width: 64
texture_height: 32
mind: passive
health: 10
speed: 0.125
half_width: 0.45
height: 0.9
drops:
  - { item: leather, count: 0, max: 1 }
spawn:
  weight: 0
  pack_min: 2
  pack_max: 4
  max_light: 15
  max_block_light: 15
  # The published game's animals come where the light is above 8.
  min_light: 9
  min_distance: 24
  on: [grass_block]
  biomes: [plains, sunflower_plains, meadow, forest, flower_forest, birch_forest, savanna]
parts:
  - { size: [8, 8, 8], pivot: [6, 0, 12], offset: [4, 0, 0], uv: [0, 0], moves: head }
  - { size: [14, 8, 6], pivot: [0, 0, 9], offset: [0, 0, 0], uv: [16, 16] }
  - { size: [4, 4, 6], pivot: [5, 2, 6], offset: [0, 0, -3], walk_swing: 1.4, uv: [0, 16] }
  - { size: [4, 4, 6], pivot: [5, -2, 6], offset: [0, 0, -3], walk_swing: -1.4, uv: [0, 16] }
  - { size: [4, 4, 6], pivot: [-5, 2, 6], offset: [0, 0, -3], walk_swing: -1.4, uv: [0, 16] }
  - { size: [4, 4, 6], pivot: [-5, -2, 6], offset: [0, 0, -3], walk_swing: 1.4, uv: [0, 16] }
male:
  name: boar
  scale: 1.2
  # Tusks, which turn with the head.
  parts:
    - { size: [1, 1, 3], pivot: [6, 0, 12], offset: [9, 3, -3], uv: [0, 0], moves: head }
    - { size: [1, 1, 3], pivot: [6, 0, 12], offset: [9, -3, -3], uv: [0, 0], moves: head }
  drops:
    - { item: leather, count: 1 }
female:
  name: sow
  scale: 1
