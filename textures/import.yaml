# What compile/src/texture_pack imports, and from where. See textures/README.md. Every file in the pack is named here,
# as a texture, a skip with its reason, or evidence of the licence: the import refuses a pack with anything else in it.
#
# Names are this game's, not the pack's. The pack was drawn for Minetest, so aspen is our birch, pine our spruce, papyrus
# our sugar cane and steel our iron. A pack file that shows only a transparent overlay is composited on what Minetest
# would have drawn under it, with `over`, since our renderer samples one texture per face.
pack:
  id: pixel_perfection
  title: Pixel Perfection
  url: https://github.com/minetest-texture-packs/Pixel-Perfection
  commit: 7935d064fc6f993d1b5038ed5ec17a615600cf0a
  licence: CC-BY-SA-4.0
  authors: ['Hugh "XSSheep" Rutland', Toby109tt, tacotexmex, devurandom]
  # The pack has no LICENSE file, so these two statements are all it says. Stage 06.2's Issues section has the review.
  evidence:
    - { file: texture_pack.conf, contains: "license = CC-BY-SA-4.0" }
    - { file: README.md, contains: "Creative Commons Attribution-Share Alike 4.0 International License" }

