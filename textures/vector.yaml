# What pixels cannot say about a texture, and every texture the game needs. Read by compile/src/texture_vector, whose part
# materials/README.md explains it. It is here and not in each index.yaml because a re-import replaces those of pack textures.
materials:
  # ---- Light. Levels are block light, 0 to 15. min_luma and warm keep a stick or a brick from shining with its flame. A row no pixel passes is refused ----
  - { texture: blocks/lava_still, emissive: 15 }
  - { texture: blocks/lava_flow, emissive: 15 }
  - { texture: blocks/fire, emissive: 15 }
  - { texture: blocks/torch_floor, emissive: 14, min_luma: 130, warm: true }
  - { texture: blocks/torch_wall, emissive: 14, min_luma: 130, warm: true }
  - { texture: blocks/torch_ceiling, emissive: 14, min_luma: 130, warm: true }
  - { texture: blocks/torch_lean_side, emissive: 14, min_luma: 130, warm: true }
  - { texture: blocks/torch_lean_cap, emissive: 14, min_luma: 130, warm: true }
  - { texture: blocks/furnace_front_lit, emissive: 13, min_luma: 90, warm: true, alpha: opaque }
  - { texture: blocks/tnt_top_burning, emissive: 8 }
  - { texture: blocks/jack_o_lantern, emissive: 15, min_luma: 150, warm: true }
  - { texture: blocks/cave_vines_lit, emissive: 14, min_luma: 130, warm: true }
  - { texture: blocks/glow_lichen, emissive: 7, min_luma: 180 }
  - { texture: blocks/sculk_vein, emissive: 1, min_luma: 60 }
  - { texture: ui/sun, emissive: 15 }
  - { texture: ui/moon, emissive: 4 }
  # ---- Alpha. The pack's leaves are 5 where a leaf is absent: nothing to blend, so they are holes ----
  - { texture: blocks/acacia_leaves, alpha: cutout }
  - { texture: blocks/birch_leaves, alpha: cutout }
  - { texture: blocks/jungle_leaves, alpha: cutout }
  - { texture: blocks/oak_leaves, alpha: cutout }
  - { texture: blocks/spruce_leaves, alpha: cutout }
  - { texture: items/wheat, alpha: cutout }
