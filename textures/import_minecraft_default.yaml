# What `texture_pack import-default` takes from Minecraft's default textures, for a copy of textures/ on this machine only.
# See textures/README.md, "Minecraft's default textures". This file holds names and no art, so it is committed. The art
# is Mojang's: it lives in /tmp/mc_c_assets/minecraft_default/ and textures_local/, which git ignores, and is never
# committed or published, since this repository is public.
#
# Every texture in textures/ is named here once: `from` a file under assets/minecraft/textures/, `stack` several files
# as frames, or `keep` ours with the reason. The result must be the size of ours: `crop` takes [x, y, width, height]
# of the file first, and `frames` splits it into a vertical strip. An animation may become a still, since the game
# draws frame 0 of everything but the crack. `over` composites onto an opaque file, after `tint`.
#
# Minecraft's grass, leaves, vines and water are grey, and coloured by biome when drawn. Our renderer has no biome tint
# yet, so `tint` bakes one colour per kind at import: Minecraft's plains colours, its birch, spruce and mangrove
# foliage, its default water, and its savanna grass for our dry grass. River water is ours, a lighter blue.
pack:
  id: minecraft_default
  title: Minecraft's default resources
  version: "26.3"
  client_sha1: e877b6a07acd633fb3bb475002175cec036e7b87
  licence: Mojang's, for local use only, never committed
tints:
  grass: 91bd59
  dry_grass: bfb755
  foliage: 77ab2f
  birch: 80a755
  spruce: "619961"
  mangrove: 8db127
  water: 3f76e4
  river_water: 5a8fea
  lily_pad: "208030"
  stem: e0c71c

