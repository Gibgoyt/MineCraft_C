# The far field's levels. See compile/config/README.md for the fields; compile/config/render/budget/ has its jobs and bytes.
margin_columns:
  value: 2
  type: u32
  unit: count
  min: 1
  max: 8
  why: "How many columns past what rays are let into are kept built, so that an eye moving on finds the next row already there. Below radius_columns. RENDER_LOD_MARGIN_COLUMNS."
features_shift_max:
  value: 2
  type: u32
  unit: levels
  min: 0
  max: 6
  why: "The coarsest voxel, as a shift, that a world's ground grows trees and the like for: 2 is voxels of 4 blocks. Growing is nearly all of what a column costs (59 ms against 8 ms at voxels of 8, plan 005 phase 14), and past 900 blocks a tree is a few pixels. RENDER_LOD_FEATURES_SHIFT_MAX."
pixel_error:
  value: 2.0
  type: f32
  unit: pixels
  min: 0.25
  max: 16.0
  why: "A coarser level is used only where it moves a surface by at most this many pixels on screen: level k from s_k / (2 E theta) blocks (master 2.2). Plan 009 phase 03 plans the pyramid by it; phase 04 draws from it."
near_guarantee:
  value: 16
  type: u32
  unit: blocks
  min: 16
  max: 256
  why: "Ahmed, 2026-11-12: every surface seen within this many blocks is drawn from the blocks themselves, so no level above 0 starts nearer."
level_count:
  value: 6
  type: u32
  unit: count
  min: 2
  max: 6
  why: "The most levels above the blocks the pyramid has: voxels of 2 up to 2 to the power of this. At most LOD_LEVELS_MAX."
radius_columns_max:
  value: 32
  type: u32
  unit: count
  min: 4
  max: 64
  why: "The widest a pyramid level may be each way from the eye's column, in its own columns of 16 voxels: level 1 at a pixel error of 2 wants 27 at render distance 64. Held in uint8_t radii."
octant_levels:
  value: 2
  type: u32
  unit: levels
  min: 0
  max: 3
  why: "How many levels above the blocks are made from the blocks where they are loaded, each from the one below, so an edit reaches them at once: 2 is levels 1 and 2. Past them, and where blocks are not loaded, levels are sampled from terrain."
band_dither:
  value: 0.08
  type: f32
  unit: ratio
  min: 0.0
  max: 0.25
  why: "A band edge moves by up to this share of its distance per pixel, and per frame with TAA on, so TAA blends two levels across a band and no ring is drawn (plan 009 phase 04). Never under near_guarantee."
block_margin_chunks:
  value: 2
  type: u32
  unit: chunks
  min: 1
  max: 8
  why: "What the game holds block by block (level 0) is d_1 plus this, so that a pixel's dithered d_1 and an eye moving inside its chunk stay inside it (plan 009 phase 04)."
block_radius_min_chunks:
  value: 12
  type: u32
  unit: chunks
  min: 4
  max: 64
  why: "Level 0 is never held narrower than this, as the sim, mining and mobs need real blocks about the player whatever the pixel error (master section 9). Never more than the render distance."
block_radius_max_chunks:
  value: 48
  type: u32
  unit: chunks
  min: 8
  max: 64
  why: "Level 0 is never held wider than this: the table is sized at world open for the narrowest field of view, up to here (master Q4). A narrower view past it gets the coarser level sooner."
turn_cache_side:
  value: 1024
  type: u32
  unit: count
  min: 0
  max: 2048
  why: "Plan 008 phase 06: texels along each of the six faces of the far field's turn cache, a cube round the eye holding each direction's far ray. 1024 is 0.088 degrees a texel at a face's middle against 0.065 a pixel at the middle of 1080 rows of 70 degrees, so about a pixel; 6 x 1024^2 x 16 bytes is 96 MiB of the voxels' pool. 768 (54 MiB) is the fallback if that is too much; 0 is no cache."
turn_revise_frames:
  value: 30
  type: u32
  unit: frames
  min: 1
  max: 600
  why: "Plan 008 phase 06: the fewest frames between two ends of the turn cache's generation for far columns sent (a level's square shown moving ends it at once). At Ahmed's spot at render distance 64 the pyramid sends about 3 columns a frame for a long while after filling; ending the generation for each kept the cache from ever being read. A far column sent then shows in what a turn reads from the cache at most this many frames late, half a second at 60."
