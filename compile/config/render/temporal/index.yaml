# TAA, cuda/src/post/'s temporal pass. See compile/config/README.md for the fields.
taa_blend:
  value: 0.1
  type: f32
  unit: ratio
  min: 0.01
  max: 1.0
  why: "What a frame adds to what the temporal pass has of a pixel: a tenth, so that about 20 frames make up what is seen. 1.0 is no history. POST_TAA_BLEND."
taa_clip_sigma:
  value: 1.25
  type: f32
  unit: ratio
  min: 0.25
  max: 8.0
  why: "How many standard deviations of the pixels around it a pixel's history may be from their mean before it is pulled in. Smaller ghosts less and shimmers more. POST_TAA_CLIP."
taa_still:
  value: 0.002
  type: f32
  unit: pixels
  min: 0.0
  max: 0.5
  why: "A place in the last frame this near a pixel's centre is that pixel, with no filter to blur it: a still camera. POST_TAA_STILL."
taa_fast_pixels:
  value: 2.0
  type: f32
  unit: pixels
  min: 0.0
  max: 1000.0
  why: "Plan 008 phase 04: a camera that turned more than this many pixels at the picture's centre since the last frame reads its history the cheap way (POST_TAA_FAST_READ); below it Catmull-Rom's 16, and a still camera its own pixel. At 1080 rows and 70 degrees that is 7.8 degrees a second at 60 pictures. POST_TAA_FAST_PIXELS."
taa_fast_read:
  value: 1
  type: u32
  unit: count
  min: 0
  max: 2
  why: "Plan 008 phase 04: how a camera past taa_fast_pixels reads its history: 0 Catmull-Rom's 16 as below it, 1 bilinear's 4, 2 the 5-tap bicubic (five bilinear reads, Jimenez 2016). Measured at Ahmed's spot at 148 MHz, post at 720 degrees a second: 7.02 ms by Catmull-Rom, 7.76 by 5-tap (20 loads without the texture unit, and two divisions), 4.40 by bilinear, against 4.20 still; so 1. POST_TAA_FAST_READ."
