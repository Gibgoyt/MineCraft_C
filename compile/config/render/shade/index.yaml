# Numbers that tune shade's speed and look. See compile/config/README.md for the fields, and cuda/src/shade/README.md for what each does.
alpha_layers:
  value: 16
  type: u32
  unit: count
  min: 1
  max: 64
  why: "Surfaces a primary ray may look at, holes in leaves and the like included, before it stops on the last one. SHADE_ALPHA_LAYERS."
sun_layers:
  value: 8
  type: u32
  unit: count
  min: 1
  max: 64
  why: "Surfaces a sun ray may look at, holes included, before it calls the sun hidden. SHADE_SUN_LAYERS."
ao_turns:
  value: 4
  type: u32
  unit: count
  min: 1
  max: 4
  why: "A pixel with history sends its one AO ray on one frame of this many, in turn with the three next to it. shade_ao_turn's table has four places, one per 8 x 4 warp of a 2 x 2 group, so 4 is the most; below 4 some places get no turn. SHADE_AO_TURNS."
ao_fresh_rays:
  value: 4
  type: u32
  unit: count
  min: 1
  max: 64
  why: "AO rays a pixel sends when nothing from the last frame is on its surface, itself or around it. SHADE_AO_FRESH_RAYS."
ao_samples_max:
  value: 32
  type: u32
  unit: count
  min: 1
  max: 1024
  why: "How many samples a pixel's AO is the mean of, at most. Past this the oldest count for less. Held in shade_ao_pixel_t.samples, a uint16_t. SHADE_AO_SAMPLES_MAX."
ao_reach:
  value: 3.0
  type: f32
  unit: blocks
  min: 0.5
  max: 5.0
  why: "How far an AO ray looks. SHADE_AO_STEPS, 12, must cover reach * sqrt(3) + 3 cell planes, which 5.0 still does. SHADE_AO_REACH."
shaft_steps:
  value: 6
  type: u32
  unit: steps
  min: 1
  max: 64
  why: "How many places along a god ray ask about the sun. SHADE_SHAFT_STEPS."
water_seen_blocks:
  value: 48.0
  type: f32
  unit: blocks
  min: 1.0
  max: 512.0
  why: "Past this many blocks of water nothing behind it can be told from none, so a ray with tint on looks no further. SHADE_WATER_SEEN_BLOCKS."
ao_corner_floor:
  value: 0.25
  type: f32
  unit: ratio
  min: 0.0
  max: 1.0
  why: "Plan 008 phase 04: what a corner between two walls comes to in the first guess a newly seen pixel gets with no rays (shade_ao_corner). 0.25 is what ray AO converges to at that corner: a quarter of the cosine-weighted sky is open there, worked out from the same integral the AO test's reference adds up. SHADE_AO_CORNER_FLOOR."
ao_cache_age_frames:
  value: 240
  type: u32
  unit: frames
  min: 1
  max: 100000
  why: "Plan 008 phase 04: an entry of the AO cache older than this many frames (4 s at 60) is a miss. SHADE_AO_CACHE_AGE."
ao_cache_samples_cap:
  value: 8
  type: u32
  unit: count
  min: 1
  max: 32
  why: "Plan 008 phase 04: how many samples a newly seen pixel takes its AO from the cache as, at most, so that its own rays still move it. SHADE_AO_CACHE_SAMPLES_CAP."
ao_cache_still_every:
  value: 8
  type: u32
  unit: count
  min: 1
  max: 32
  why: "Plan 008 phase 04: with the camera still, a pixel's AO ray writes the AO cache on one of this many of its turns (every 32 frames at 4 turns), and on every one while it moves. Writing on every turn made a still picture's AO history pass 16 % dearer at Ahmed's spot. SHADE_AO_CACHE_STILL_EVERY."
shadow_cone_scale:
  value: 1.0
  type: f32
  unit: ratio
  min: 0.25
  max: 8.0
  why: "Plan 009 phase 06: how much coarser than the light's own cone a shadow ray may step levels. A shadow ray moves to level k once it has gone L_k = (2^k / 2) / (tan(light_angular_diameter) x this) blocks from its surface: 108, 216 and 432 for levels 1, 2 and 3 at 1. 1 is physical (no detail is lost that a real light would not blur away); above 1 coarser and cheaper, below 1 finer, which keeps thin far shadows. SHADE_SHADOW_CONE_SCALE, shade_shadow_cone_base."
light_angular_diameter:
  value: 0.53
  type: f32
  unit: degrees
  min: 0.1
  max: 5.0
  why: "Plan 009 phase 06: how wide the sun and the full moon look. Only sizes the cone above; shadows stay one ray, hard-edged. SHADE_LIGHT_ANGULAR_DIAMETER."
shadow_skip_below:
  value: 0.0078
  type: f32
  unit: ratio
  min: 0.0
  max: 0.05
  why: "Plan 009 phase 06, the dim-light cut: no shadow ray is sent while the direct light could move no pixel by more than this share of a byte's range after the tone map (2 / 255 by default): max(direct) x 12.92 at most, sRGB's steepest part. Fires only within a fraction of a degree of the horizon and under the thickest cloud near it, never on moonlight. 0 turns it off. SHADE_SHADOW_SKIP_BELOW, shade_shadows_skipped."
alpha_far_from_blocks:
  value: 48.0
  type: f32
  unit: blocks
  min: 16.0
  max: 512.0
  why: "Plan 009 phase 06: past this, a leaf's texel (1 / 16 of a block) is under a pixel at 1080p and 70 degrees (771 / 16), so which hole a ray goes through is noise TAA averages, and a pixel's ray looks at no more than alpha_layers_far surfaces. SHADE_ALPHA_FAR_FROM."
alpha_layers_far:
  value: 4
  type: u32
  unit: count
  min: 1
  max: 16
  why: "Plan 009 phase 06: surfaces a pixel's ray may look at, holes and all, when the one it is at is past alpha_far_from_blocks; it then stops on that texture's mean colour, as alpha_layers does nearer. SHADE_ALPHA_LAYERS_FAR."
