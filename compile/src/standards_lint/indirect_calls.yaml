# Every function that calls through a function pointer, and why none of its targets can call back into it.
# plans/CODING_STANDARD.md section 10. GCC records such a call as "__indirect_call", with no target, so the
# recursion check cannot follow it; this list is the review that takes its place, and standards_lint holds it
# true: a caller that is missing fails the build (indirect_call_unlisted), and so does an entry that no longer
# calls through a pointer, or names a function or file that is gone (indirect_call_stale). See README.md.
#
# file:    where the function is written, from the repository root: a header for a static inline function
# caller:  its own name, as in the source
# pointer: the type of what it calls
# why:     why no target can reach the caller again
#
# Job functions are not listed one by one: job_dispatchers names the function that runs jobs, and the lint adds
# an edge from it to every function the sources hand to job_spawn, job_submit or job_try_submit (or their
# _at forms), so a job that can reach its own submission is reported as recursion.
root: ../../..

job_dispatchers:
  - file: run/src/job/index.c
    caller: job_run
    why: "Runs job.function; the lint adds an edge to each function the sources pass to the job system."

indirect_calls:
  - file: bench/lod/index.c
    caller: bench_lod_column
    pointer: "render_lod_sample_t"
    why: "Targets sample terrain for one column (render_lod_sample_terrain); they never run the bench."
  - file: bench/simd/index.c
    caller: bench_measure
    pointer: "bench_reset_t and bench_run_t"
    why: "Targets reset buffers and run one kernel over a row; leaf work that never measures."
  - file: bench/simd/index.c
    caller: bench_run_row
    pointer: "bench_fill_t"
    why: "Targets fill a bench's input buffers and call nothing back."
